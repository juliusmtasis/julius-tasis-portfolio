<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julius Tasis - Senior Multimedia Designer & Video Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 20px; font-weight: 700; text-decoration: none; color: #111827; letter-spacing: -0.025em; }
        nav { display: flex; gap: 32px; font-size: 14px; font-weight: 500; }
        nav a { text-decoration: none; color: #4B5563; transition: color 0.2s; }
        nav a:hover { color: #111827; }
        
        main {
            flex-grow: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 24px;
            width: 100%;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 64px auto;
        }
        .hero h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 16px;
        }
        .hero p {
            font-size: 16px;
            color: #4B5563;
            line-height: 1.6;
        }

        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 32px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .category-card {
            background-color: #000000;
            border-radius: 4px;
            overflow: hidden;
            text-decoration: none;
            display: block;
            position: relative;
            aspect-ratio: 4 / 3;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-image {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            display: block;
        }
        .category-card:hover .card-image img {
            transform: scale(1.03);
        }
        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 24px 20px 16px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
            color: #ffffff;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: -0.01em;
        }

        footer {
            width: 100%;
            padding: 32px 0;
            text-align: center;
            font-size: 12px;
            color: #9CA3AF;
            border-top: 1px solid #F3F4F6;
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Julius Tasis</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="#work">Work</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Julius Tasis</h1>
            <p>A Multimedia Designer specializing in strategic visual solutions and brand storytelling for global corporate enterprises.</p>
        </div>

        <!-- Category Grid -->
        <div id="work" class="category-grid">
            <!-- Digital Assets -->
            <a href="digital-assets.html" class="category-card">
                <div class="card-image">
                    <img src="images/digital_assets/cover.jpg" alt="Digital Assets">
                </div>
                <div class="card-title">Digital Assets</div>
            </a>

            <!-- Documents -->
            <a href="documents.html" class="category-card">
                <div class="card-image">
                    <img src="images/documents/cover.jpg" alt="Documents">
                </div>
                <div class="card-title">Documents</div>
            </a>

            <!-- Logos -->
            <a href="logos.html" class="category-card">
                <div class="card-image">
                    <img src="images/logos/cover.jpg" alt="Logos">
                </div>
                <div class="card-title">Logos</div>
            </a>

            <!-- Motion Graphics -->
            <a href="motion-graphics.html" class="category-card">
                <div class="card-image">
                    <img src="images/motion_graphics/cover.jpg" alt="Motion Graphics">
                </div>
                <div class="card-title">Motion Graphics</div>
            </a>

            <!-- Print -->
            <a href="print.html" class="category-card">
                <div class="card-image">
                    <img src="images/print/cover.jpg" alt="Print">
                </div>
                <div class="card-title">Print</div>
            </a>

            <!-- Social Graphics -->
            <a href="social-graphics.html" class="category-card">
                <div class="card-image">
                    <img src="images/social_graphics/cover.jpg" alt="Social Graphics">
                </div>
                <div class="card-title">Social Graphics</div>
            </a>

            <!-- Video Editing -->
            <a href="video-editing.html" class="category-card">
                <div class="card-image">
                    <img src="images/video_editing/cover.jpg" alt="Video Editing">
                </div>
                <div class="card-title">Video Editing</div>
            </a>

            <!-- Website -->
            <a href="website.html" class="category-card">
                <div class="card-image">
                    <img src="images/website/cover.jpg" alt="Website">
                </div>
                <div class="card-title">Website</div>
            </a>
        </div>
    </main>

    <footer>
        <p>© 2026 Julius Tasis. All rights reserved.</p>
    </footer>

</body>
</html>
