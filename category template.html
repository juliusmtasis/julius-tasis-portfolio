<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Category - Julius Tasis</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 20px; font-weight: 700; text-decoration: none; color: #111827; letter-spacing: -0.025em; }
        nav { display: flex; gap: 32px; font-size: 14px; font-weight: 500; }
        nav a { text-decoration: none; color: #4B5563; transition: color 0.2s; }
        nav a:hover { color: #111827; }
        main {
            flex-grow: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 24px;
            width: 100%;
        }
        .page-header { text-align: center; margin-bottom: 64px; }
        .page-header h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.025em; margin-bottom: 16px; }
        .divider { width: 64px; height: 1px; background-color: #D1D5DB; margin: 16px auto; }
        .back-link { font-size: 12px; color: #6B7280; text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.2s; }
        .back-link:hover { color: #111827; }
        
        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .gallery-item {
            background-color: #000000;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.03);
        }
        footer {
            width: 100%;
            padding: 32px 0;
            text-align: center;
            font-size: 12px;
            color: #9CA3AF;
            border-top: 1px solid #F3F4F6;
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Julius Tasis</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#work">Work</a>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h1 id="category-title">Category Title</h1>
            <div class="divider"></div>
            <a href="index.html#work" class="back-link">← Back to Categories</a>
        </div>

        <!-- Gallery Items (Drop your images here) -->
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="images/placeholder.jpg" alt="Design Asset">
            </div>
            <div class="gallery-item">
                <img src="images/placeholder.jpg" alt="Design Asset">
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Julius Tasis. All rights reserved.</p>
    </footer>

</body>
</html>
